<!DOCTYPE html>
<html lang="en">
<head>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0a;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Inter', system-ui, sans-serif;
  }
  .scene {
    perspective: 1000px;
    perspective-origin: 50% 50%;
  }
  .cube-container {
    width: 200px;
    height: 200px;
    position: relative;
    transform-style: preserve-3d;
    animation: forgeSpin 6.5s cubic-bezier(0.25, 0.1, 0.25, 1.0) infinite;
  }
  .face {
    position: absolute;
    width: 200px;
    height: 200px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 80px;
    font-weight: 900;
    background: linear-gradient(135deg, #2d3748 0%, #1a202c 100%);
    border: 3px solid #0f172a;
  }
  .face.front  { transform: rotateY(  0deg) translateZ(100px); }
  .face.right  { transform: rotateY( 90deg) translateZ(100px); }
  .face.back   { transform: rotateY(180deg) translateZ(100px); }
  .face.left   { transform: rotateY(-90deg) translateZ(100px); }
  .face.top    { transform: rotateX( 90deg) translateZ(100px); display: none; }
  .face.bottom { transform: rotateX(-90deg) translateZ(100px); display: none; }
  
  /* S and C glow full brightness */
  .face.front, .face.right {
    color: #e85d04;
    text-shadow: 0 0 40px rgba(232,93,4,0.8), 0 0 80px rgba(232,93,4,0.4);
    -webkit-text-stroke: 3px #f97316;
    box-shadow: inset 0 0 40px rgba(232,93,4,0.4);
  }
  
  /* A and I dimmer */
  .face.back, .face.left {
    color: #6b7280;
    text-shadow: 0 0 15px rgba(232,93,4,0.3);
    -webkit-text-stroke: 3px #4b5563;
    box-shadow: inset 0 0 20px rgba(232,93,4,0.1);
  }
  
  /* Axis rod */
  .axis-rod {
    position: absolute;
    width: 8px;
    height: 320px;
    background: linear-gradient(to bottom, #374151, #6b7280, #374151);
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    border-radius: 4px;
    opacity: 0.3;
    pointer-events: none;
    z-index: -1;
  }
  
  .label {
    margin-top: 60px;
    color: #6b7280;
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 0.2em;
  }
  
  .brand-label {
    margin-top: 12px;
    color: #e85d04;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.05em;
  }
  
  /* Perplexity-style spin: rapid in, decelerate, linger on S and C */
  @keyframes forgeSpin {
    0%    { transform: rotateY(0deg); }
    /* Spin-in: rapid rotation (540° over 1.5s) */
    23%   { transform: rotateY(720deg); }
    /* Decelerate into S */
    30.7% { transform: rotateY(810deg); }
    /* Linger on S (2s) */
    61.5% { transform: rotateY(810deg); }
    /* Linger on C (1.5s) */
    84.6% { transform: rotateY(990deg); }
    /* Quick A pass (0.5s) */
    92.3% { transform: rotateY(1080deg); }
    /* Quick I pass (0.5s) → loop */
    100%  { transform: rotateY(1170deg); }
  }
</style>
</head>
<body>
  <div class="scene">
    <div class="cube-container">
      <div class="axis-rod"></div>
      <div class="face front">S</div>
      <div class="face right">C</div>
      <div class="face back">A</div>
      <div class="face left">I</div>
      <div class="face top">S</div>
      <div class="face bottom">S</div>
    </div>
  </div>
  <div class="label">Structure meets precision.</div>
  <div class="brand-label">ScopeCrete</div>
</body>
</html>
