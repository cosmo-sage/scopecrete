<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ScopeCrete — Concrete Bid Calculator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f1117; --card: #1a1d27; --card-hover: #21253a;
      --border: #2a2f45; --text: #e8eaf0; --text-muted: #8891a8;
      --accent: #f59e0b; --accent-hover: #d97706;
      --green: #22c55e; --red: #ef4444; --input-bg: #0f1117;
    }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 1rem; }
    .container { max-width: 600px; margin: 0 auto; }
    h1 { font-size: 1.5rem; text-align: center; margin-bottom: 1.5rem; color: var(--text); }

    /* Metrics row */
    .metrics-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.5rem; margin-bottom: 1rem; }
    .metric { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 0.625rem; text-align: center; }
    .metric .value { font-size: 1.125rem; font-weight: 700; color: var(--accent); }
    .metric .label { font-size: 0.5625rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); margin-top: 2px; }

    /* Add Section button - at top */
    #addSectionBtn { width: 100%; padding: 0.75rem; background: var(--card); border: 2px dashed var(--accent); border-radius: 12px; color: var(--accent); font-size: 0.9375rem; font-weight: 600; cursor: pointer; margin-bottom: 0.75rem; transition: all 0.2s; }
    #addSectionBtn:hover { background: var(--card-hover); }

    /* Sections */
    .section { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 1rem; margin-bottom: 0.75rem; }
    .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem; }
    .section-title { font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); }
    .delete-section { background: none; border: none; color: var(--red); font-size: 1.2rem; cursor: pointer; padding: 0 0.25rem; line-height: 1; }

    .field { margin-bottom: 0.75rem; }
    .field:last-child { margin-bottom: 0; }
    label { display: block; font-size: 0.8125rem; color: var(--text-muted); margin-bottom: 0.3rem; }
    input, select { width: 100%; padding: 0.5rem 0.75rem; background: var(--input-bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 0.9375rem; }
    input:focus, select:focus { outline: none; border-color: var(--accent); }
    .row { display: flex; gap: 0.75rem; }
    .row .field { flex: 1; }

    /* Material toggles */
    .toggles { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 0.75rem; }
    .toggle-btn { padding: 0.375rem 0.75rem; border-radius: 100px; font-size: 0.75rem; font-weight: 600; cursor: pointer; border: 1px solid var(--border); background: var(--input-bg); color: var(--text-muted); transition: all 0.15s; }
    .toggle-btn.active { background: var(--accent); color: #000; border-color: var(--accent); }

    /* Equipment selector */
    .equip-row { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
    .equip-btn { flex: 1; padding: 0.5rem; border-radius: 8px; font-size: 0.75rem; font-weight: 600; cursor: pointer; border: 1px solid var(--border); background: var(--input-bg); color: var(--text-muted); text-align: center; transition: all 0.15s; }
    .equip-btn.active { background: var(--green); color: #000; border-color: var(--green); }

    /* Cost Cards Button */
    #openCostCards { width: 100%; padding: 0.875rem; background: var(--card); border: 1px solid var(--border); border-radius: 12px; color: var(--text); font-size: 0.9375rem; font-weight: 600; cursor: pointer; margin-bottom: 1rem; display: flex; justify-content: space-between; align-items: center; }
    #openCostCards:hover { background: var(--card-hover); }
    #openCostCards .arrow { color: var(--text-muted); }

    /* Output */
    .output-section { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 1.25rem; margin-bottom: 1rem; }
    .line-items { border-top: 1px solid var(--border); padding-top: 0.75rem; }
    .line-item { display: flex; justify-content: space-between; padding: 0.3rem 0; font-size: 0.875rem; }
    .line-item .name { color: var(--text-muted); }
    .line-item .amount { font-weight: 600; font-variant-numeric: tabular-nums; }
    .line-item.total-line { border-top: 1px solid var(--border); margin-top: 0.5rem; padding-top: 0.5rem; font-weight: 600; }
    .line-item.total-line .name { color: var(--text); }
    .line-item.total-line .amount { color: var(--accent); font-size: 1.1rem; }

    /* Markup */
    .markup-control { margin-top: 1rem; padding: 0.875rem; background: var(--input-bg); border-radius: 10px; }
    .markup-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; }
    .markup-header span { font-size: 0.8125rem; color: var(--text-muted); }
    .markup-header strong { color: var(--accent); font-size: 1rem; }
    input[type="range"] { width: 100%; height: 6px; border-radius: 3px; background: var(--border); border: none; cursor: pointer; -webkit-appearance: none; }
    input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; background: var(--accent); border-radius: 50%; cursor: pointer; }
    .bid-amount { text-align: center; font-size: 1.75rem; font-weight: 700; color: var(--green); margin-top: 0.75rem; }

    /* Action buttons */
    .btn-row { display: flex; gap: 0.75rem; margin-top: 1rem; }
    .btn { flex: 1; padding: 0.875rem; border-radius: 10px; font-size: 0.9375rem; font-weight: 600; cursor: pointer; border: none; transition: all 0.2s; }
    .btn-primary { background: var(--green); color: #000; }
    .btn-primary:hover { background: #16a34a; }
    .btn-secondary { background: var(--card); color: var(--text); border: 1px solid var(--border); }
    .btn-secondary:hover { background: var(--card-hover); }

    /* Cost Cards Modal */
    #costCardsOverlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 100; }
    #costCardsOverlay.active { display: flex; align-items: flex-end; }
    #costCardsModal { display: none; position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); border-radius: 20px 20px 0 0; max-height: 85vh; overflow-y: auto; z-index: 101; }
    #costCardsOverlay.active #costCardsModal { display: block; }
    .modal-handle { width: 40px; height: 4px; background: var(--border); border-radius: 2px; margin: 0.75rem auto 1rem; }
    .modal-tabs { display: flex; gap: 0.5rem; padding: 0 1rem 1rem; }
    .modal-tab { flex: 1; padding: 0.625rem; background: var(--input-bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text-muted); font-size: 0.8125rem; font-weight: 600; cursor: pointer; text-align: center; }
    .modal-tab.active { background: var(--accent); color: #000; border-color: var(--accent); }
    .card-content { padding: 0 1rem 1.5rem; }
    .card-field { margin-bottom: 0.875rem; }
    .card-field label { font-size: 0.75rem; margin-bottom: 0.25rem; }
    .card-field input, .card-field select { padding: 0.5rem 0.625rem; font-size: 0.875rem; width: 100%; }

    /* Saved jobs */
    .saved-jobs { margin-top: 1rem; }
    .saved-job { display: flex; justify-content: space-between; align-items: center; padding: 0.75rem; background: var(--card); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 0.5rem; cursor: pointer; }
    .saved-job:hover { background: var(--card-hover); }
    .saved-job-info .job-name { font-size: 0.875rem; font-weight: 600; }
    .saved-job-info .job-date { font-size: 0.75rem; color: var(--text-muted); margin-top: 2px; }
    .saved-job-amount { font-size: 0.9375rem; font-weight: 700; color: var(--green); }
    .saved-job-delete { background: none; border: none; color: var(--red); font-size: 1rem; cursor: pointer; padding: 0 0.25rem; }

    /* Toast */
    #toast { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--green); color: #000; padding: 0.75rem 1.5rem; border-radius: 100px; font-size: 0.875rem; font-weight: 600; opacity: 0; transition: all 0.3s; z-index: 200; }
    #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  </style>
</head>
<body>
  <div class="container">
    <h1>ScopeCrete</h1>

    <!-- Top metrics row -->
    <div class="metrics-row">
      <div class="metric"><div class="value" id="costSqFt">$0.00</div><div class="label">$/SqFt</div></div>
      <div class="metric"><div class="value" id="costSqYd">$0.00</div><div class="label">$/SqYd</div></div>
      <div class="metric"><div class="value" id="costDay">$0</div><div class="label">$/Day</div></div>
    </div>

    <!-- Add Section - prepends to top -->
    <button id="addSectionBtn" onclick="addSectionTop()">+ Add Section</button>

    <!-- Sections container - new sections prepend -->
    <div id="sectionsContainer"></div>

    <!-- Equipment selector -->
    <div class="equip-row">
      <button class="equip-btn active" id="equip-tailgate" onclick="setEquip(0)">Tailgate</button>
      <button class="equip-btn" id="equip-buggy" onclick="setEquip(1)">Georgia Buggy</button>
      <button class="equip-btn" id="equip-pump" onclick="setEquip(2)">Pump Truck</button>
    </div>

    <!-- Material toggles -->
    <div class="toggles" id="matToggles">
      <button class="toggle-btn active" id="tog-rebar" onclick="toggleMat('rebar')">Rebar</button>
      <button class="toggle-btn" id="tog-mesh" onclick="toggleMat('mesh')">Wire Mesh</button>
      <button class="toggle-btn" id="tog-gravel" onclick="toggleMat('gravel')">Gravel Base</button>
    </div>

    <button id="openCostCards" onclick="openCostCards()">
      <span>My Cost Cards</span>
      <span class="arrow">&#8250;</span>
    </button>

    <div class="output-section">
      <div class="line-items" id="lineItems"></div>
      <div class="markup-control">
        <div class="markup-header">
          <span>Markup</span>
          <strong id="markupPctLabel">22%</strong>
        </div>
        <input type="range" id="markupSlider" min="5" max="50" value="22" oninput="updateMarkup()">
        <div class="bid-amount" id="bidPrice">$0.00</div>
      </div>
    </div>

    <div class="btn-row">
      <button class="btn btn-secondary" onclick="saveJob()">Save Job</button>
      <button class="btn btn-primary" onclick="exportPDF()">Export PDF</button>
    </div>

    <div class="saved-jobs" id="savedJobsList"></div>
  </div>

  <!-- Cost Cards Overlay -->
  <div id="costCardsOverlay" onclick="closeCostCards(event)">
    <div id="costCardsModal" onclick="event.stopPropagation()">
      <div class="modal-handle"></div>
      <div class="modal-tabs">
        <button class="modal-tab active" onclick="switchCard(0)">Materials</button>
        <button class="modal-tab" onclick="switchCard(1)">Labor</button>
        <button class="modal-tab" onclick="switchCard(2)">Defaults</button>
      </div>
      <div class="card-content" id="cardContent"></div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script>
    // ===== COST CARD DATA =====
    const costCards = {
      materials: {
        concrete3000: 150, concrete4000: 160, concrete5000: 175,
        rebar: 8.50, wireMesh: 45, pumpMin: 450, pumpRate: 15, demoRate: 1.75,
        buggyDay: 250, gravelSqFt: 0.85
      },
      labor: {
        crewRate: 30, crewSize: 4, productionRate: 60, formingRate: 10, finishingRate: 51, logisticsDays: 0.25
      },
      defaults: {
        defaultPSI: 4000, defaultDepth: 4, defaultMarkup: 22
      }
    };

    // ===== SECTIONS =====
    let sections = [{ id: 1, lengthFt: 20, lengthIn: 0, widthFt: 30, widthIn: 0, depthIn: 4 }];
    let nextSectionId = 2;
    let markupPct = 22;

    // ===== MATERIAL TOGGLES =====
    const mats = { rebar: true, mesh: false, gravel: false };

    // ===== EQUIPMENT =====
    let equipType = 0; // 0=tailgate, 1=buggy, 2=pump

    function setEquip(t) {
      equipType = t;
      document.querySelectorAll('.equip-btn').forEach((b, i) => b.classList.toggle('active', i === t));
      calculate();
    }

    function toggleMat(key) {
      mats[key] = !mats[key];
      document.getElementById('tog-' + key).classList.toggle('active', mats[key]);
      calculate();
    }

    function addSectionTop() {
      sections.unshift({ id: nextSectionId++, lengthFt: 0, lengthIn: 0, widthFt: 0, widthIn: 0, depthIn: 4 });
      renderSections();
    }

    function deleteSection(id) {
      if (sections.length <= 1) return;
      sections = sections.filter(s => s.id !== id);
      renderSections();
      calculate();
    }

    function renderSections() {
      const container = document.getElementById('sectionsContainer');
      container.innerHTML = sections.map((sec, i) => `
        <div class="section" id="section-${sec.id}">
          <div class="section-header">
            <span class="section-title">Section ${i + 1}</span>
            ${sections.length > 1 ? `<button class="delete-section" onclick="deleteSection(${sec.id})">&#215;</button>` : ''}
          </div>
          <div class="row">
            <div class="field">
              <label>Length (ft)</label>
              <input type="number" id="lenFt-${sec.id}" value="${sec.lengthFt}" oninput="updateSection(${sec.id}, 'lengthFt', this.value)" min="0">
            </div>
            <div class="field">
              <label>in</label>
              <input type="number" id="lenIn-${sec.id}" value="${sec.lengthIn}" oninput="updateSection(${sec.id}, 'lengthIn', this.value)" min="0" max="11">
            </div>
          </div>
          <div class="row">
            <div class="field">
              <label>Width (ft)</label>
              <input type="number" id="widFt-${sec.id}" value="${sec.widthFt}" oninput="updateSection(${sec.id}, 'widthFt', this.value)" min="0">
            </div>
            <div class="field">
              <label>in</label>
              <input type="number" id="widIn-${sec.id}" value="${sec.widthIn}" oninput="updateSection(${sec.id}, 'widthIn', this.value)" min="0" max="11">
            </div>
          </div>
          <div class="field">
            <label>Depth (inches)</label>
            <input type="number" id="dep-${sec.id}" value="${sec.depthIn}" oninput="updateSection(${sec.id}, 'depthIn', this.value)" min="1">
          </div>
        </div>
      `).join('');
    }

    function updateSection(id, key, val) {
      const sec = sections.find(s => s.id === id);
      if (sec) sec[key] = parseFloat(val) || 0;
      calculate();
    }

    // ===== CALCULATE =====
    function calculate() {
      let totalSqFt = 0;
      let totalCY = 0;
      let concreteCost = 0;
      let shortloadFee = 0;
      let rebarCost = 0;
      let meshCost = 0;
      let gravelCost = 0;
      let formingLabor = 0;
      let finishingLabor = 0;
      let equipCost = 0;

      const psi = costCards.defaults.defaultPSI;
      const concretePrice = psi === 3000 ? costCards.materials.concrete3000 : psi === 5000 ? costCards.materials.concrete5000 : costCards.materials.concrete4000;

      sections.forEach(sec => {
        const L = sec.lengthFt + sec.lengthIn / 12;
        const W = sec.widthFt + sec.widthIn / 12;
        const depthIn = sec.depthIn || 4;
        const sqft = L * W;
        const cy = (sqft * depthIn / 12) / 27;
        totalSqFt += sqft;
        totalCY += cy;

        const secConcreteCost = cy * concretePrice;
        concreteCost += secConcreteCost;
        if (cy < 5) shortloadFee += cy * concretePrice * 0.15;

        const perimeter = 2 * (L + W);
        if (mats.rebar) {
          const rebarPcs = Math.ceil(perimeter * 12 / 24);
          rebarCost += rebarPcs * costCards.materials.rebar;
        }
        if (mats.mesh) {
          const rolls = Math.ceil(sqft / 40);
          meshCost += rolls * costCards.materials.wireMesh;
        }
        if (mats.gravel) {
          gravelCost += sqft * costCards.materials.gravelSqFt;
        }

        const sqyd = sqft / 9;
        formingLabor += perimeter * costCards.labor.formingRate;
        finishingLabor += sqyd * costCards.labor.finishingRate;
      });

      // Equipment
      if (equipType === 1) equipCost = costCards.materials.buggyDay;
      if (equipType === 2) equipCost = Math.max(totalCY * costCards.materials.pumpRate, costCards.materials.pumpMin);

      const subtotal = concreteCost + shortloadFee + rebarCost + meshCost + gravelCost + formingLabor + finishingLabor + equipCost;
      const markupAmt = subtotal * (markupPct / 100);
      const bidTotal = subtotal + markupAmt;

      // Day estimation
      const laborDays = totalSqFt / (costCards.labor.crewSize * costCards.labor.productionRate);
      const totalDays = laborDays + costCards.labor.logisticsDays;
      const costPerDay = totalDays > 0 ? bidTotal / totalDays : bidTotal;

      // Metrics
      document.getElementById('costSqFt').textContent = totalSqFt > 0 ? '$' + (bidTotal / totalSqFt).toFixed(2) : '$0.00';
      document.getElementById('costSqYd').textContent = totalSqFt > 0 ? '$' + (bidTotal / (totalSqFt / 9)).toFixed(2) : '$0.00';
      document.getElementById('costDay').textContent = '$' + Math.round(costPerDay);

      // Line items
      const li = document.getElementById('lineItems');
      li.innerHTML = `
        ${concreteCost > 0 ? `<div class="line-item"><span class="name">Concrete ${totalCY.toFixed(2)} CY @ $${concretePrice}/CY</span><span class="amount">$${concreteCost.toFixed(2)}</span></div>` : ''}
        ${shortloadFee > 0 ? `<div class="line-item"><span class="name">Short Load Fee</span><span class="amount">$${shortloadFee.toFixed(2)}</span></div>` : ''}
        ${rebarCost > 0 ? `<div class="line-item"><span class="name">Rebar (${mats.rebar ? 'on' : 'off'})</span><span class="amount">$${rebarCost.toFixed(2)}</span></div>` : ''}
        ${meshCost > 0 ? `<div class="line-item"><span class="name">Wire Mesh (${mats.mesh ? 'on' : 'off'})</span><span class="amount">$${meshCost.toFixed(2)}</span></div>` : ''}
        ${gravelCost > 0 ? `<div class="line-item"><span class="name">Gravel Base (${mats.gravel ? 'on' : 'off'})</span><span class="amount">$${gravelCost.toFixed(2)}</span></div>` : ''}
        ${formingLabor > 0 ? `<div class="line-item"><span class="name">Forming Labor</span><span class="amount">$${formingLabor.toFixed(2)}</span></div>` : ''}
        ${finishingLabor > 0 ? `<div class="line-item"><span class="name">Finishing Labor</span><span class="amount">$${finishingLabor.toFixed(2)}</span></div>` : ''}
        ${equipCost > 0 ? `<div class="line-item"><span class="name">${equipType === 1 ? 'Georgia Buggy' : 'Pump Truck'}</span><span class="amount">$${equipCost.toFixed(2)}</span></div>` : ''}
        <div class="line-item total-line"><span class="name">Subtotal</span><span class="amount">$${subtotal.toFixed(2)}</span></div>
        <div class="line-item"><span class="name">Markup (${markupPct}%)</span><span class="amount">$${markupAmt.toFixed(2)}</span></div>
        <div class="line-item total-line"><span class="name">Bid Total</span><span class="amount">$${bidTotal.toFixed(2)}</span></div>
      `;
      document.getElementById('bidPrice').textContent = '$' + bidTotal.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function updateMarkup() {
      markupPct = parseInt(document.getElementById('markupSlider').value);
      document.getElementById('markupPctLabel').textContent = markupPct + '%';
      calculate();
    }

    // ===== COST CARDS MODAL =====
    const cardDefs = [
      [ // Materials
        { key: 'concrete3000', label: 'Concrete 3000 PSI ($/CY)' },
        { key: 'concrete4000', label: 'Concrete 4000 PSI ($/CY)' },
        { key: 'concrete5000', label: 'Concrete 5000 PSI ($/CY)' },
        { key: 'rebar', label: 'Rebar ($/piece)' },
        { key: 'wireMesh', label: 'Wire Mesh ($/roll)' },
        { key: 'buggyDay', label: 'Georgia Buggy ($/day)' },
        { key: 'pumpMin', label: 'Pump Truck Min ($)' },
        { key: 'pumpRate', label: 'Pump Truck ($/CY)' },
        { key: 'gravelSqFt', label: 'Gravel Base ($/sqft)' }
      ],
      [ // Labor
        { key: 'crewRate', label: 'Crew Rate ($/hr/person)' },
        { key: 'crewSize', label: 'Crew Size (people)' },
        { key: 'productionRate', label: 'Production Rate (sqft/person/day)' },
        { key: 'formingRate', label: 'Forming Rate ($/linear ft)' },
        { key: 'finishingRate', label: 'Finishing Rate ($/sq yd)' },
        { key: 'logisticsDays', label: 'Logistics Days (buffer)' }
      ],
      [ // Defaults
        { key: 'defaultPSI', label: 'Default PSI', type: 'select', options: ['3000', '4000', '5000'] },
        { key: 'defaultDepth', label: 'Default Depth (inches)' },
        { key: 'defaultMarkup', label: 'Default Markup (%)' }
      ]
    ];

    let activeCard = 0;

    function openCostCards() {
      document.getElementById('costCardsOverlay').classList.add('active');
      switchCard(0);
    }

    function closeCostCards(e) {
      if (e && e.target !== document.getElementById('costCardsOverlay')) return;
      document.getElementById('costCardsOverlay').classList.remove('active');
      calculate();
    }

    function switchCard(idx) {
      activeCard = idx;
      document.querySelectorAll('.modal-tab').forEach((t, i) => t.classList.toggle('active', i === idx));
      const keys = Object.keys(costCards);
      const cardKey = keys[idx];
      const content = document.getElementById('cardContent');
      const defs = cardDefs[idx];
      content.innerHTML = defs.map(def => {
        const val = costCards[cardKey][def.key];
        if (def.type === 'select') {
          return `<div class="card-field"><label>${def.label}</label><select onchange="updateCard('${cardKey}', '${def.key}', this.value)">${def.options.map(o => `<option value="${o}" ${o == val ? 'selected' : ''}>${o}</option>`).join('')}</select></div>`;
        }
        return `<div class="card-field"><label>${def.label}</label><input type="number" value="${val}" onchange="updateCard('${cardKey}', '${def.key}', this.value)"></div>`;
      }).join('');
    }

    function updateCard(card, key, val) {
      costCards[card][key] = parseFloat(val) || 0;
      calculate();
    }

    // ===== SAVE / LOAD =====
    function saveJob() {
      const job = {
        id: Date.now(), date: new Date().toISOString().split('T')[0],
        sections: JSON.parse(JSON.stringify(sections)),
        costCards: JSON.parse(JSON.stringify(costCards)),
        markupPct, mats: {...mats}, equipType,
        bidTotal: document.getElementById('bidPrice').textContent
      };
      const jobs = JSON.parse(localStorage.getItem('scopecrete_jobs') || '[]');
      jobs.unshift(job);
      if (jobs.length > 20) jobs.pop();
      localStorage.setItem('scopecrete_jobs', JSON.stringify(jobs));
      renderSavedJobs();
      showToast('Job saved!');
    }

    function loadJob(id) {
      const jobs = JSON.parse(localStorage.getItem('scopecrete_jobs') || '[]');
      const job = jobs.find(j => j.id === id);
      if (!job) return;
      sections = job.sections;
      nextSectionId = Math.max(...sections.map(s => s.id)) + 1;
      Object.assign(costCards, job.costCards);
      Object.assign(mats, job.mats || { rebar: true, mesh: false, gravel: false });
      equipType = job.equipType || 0;
      markupPct = job.markupPct;
      document.getElementById('markupSlider').value = markupPct;
      // Update toggles
      ['rebar', 'mesh', 'gravel'].forEach(k => {
        document.getElementById('tog-' + k).classList.toggle('active', mats[k]);
      });
      document.querySelectorAll('.equip-btn').forEach((b, i) => b.classList.toggle('active', i === equipType));
      renderSections();
      calculate();
      showToast('Job loaded!');
    }

    function deleteJob(id, e) {
      e.stopPropagation();
      const jobs = JSON.parse(localStorage.getItem('scopecrete_jobs') || '[]').filter(j => j.id !== id);
      localStorage.setItem('scopecrete_jobs', JSON.stringify(jobs));
      renderSavedJobs();
    }

    function renderSavedJobs() {
      const jobs = JSON.parse(localStorage.getItem('scopecrete_jobs') || '[]');
      const list = document.getElementById('savedJobsList');
      if (jobs.length === 0) { list.innerHTML = ''; return; }
      list.innerHTML = '<div style="font-size:0.75rem;color:var(--text-muted);margin-bottom:0.5rem;">SAVED JOBS</div>' +
        jobs.map(j => `<div class="saved-job" onclick="loadJob(${j.id})"><div class="saved-job-info"><div class="job-name">${j.date}</div><div class="job-date">${j.sections.length} section${j.sections.length > 1 ? 's' : ''}</div></div><div style="display:flex;align-items:center;gap:0.5rem;"><span class="saved-job-amount">${j.bidTotal}</span><button class="saved-job-delete" onclick="deleteJob(${j.id}, event)">&#215;</button></div></div>`).join('');
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2000);
    }

    // ===== PDF EXPORT =====
    function exportPDF() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      const bid = document.getElementById('bidPrice').textContent;
      const psi = costCards.defaults.defaultPSI;
      const markup = markupPct;
      const totalSqFt = sections.reduce((sum, sec) => {
        const L = sec.lengthFt + sec.lengthIn / 12;
        const W = sec.widthFt + sec.widthIn / 12;
        return sum + (L * W);
      }, 0);

      doc.setFontSize(22);
      doc.setFont('helvetica', 'bold');
      doc.text('SCOPECRETE', 20, 25);
      doc.setFontSize(10);
      doc.setFont('helvetica', 'normal');
      doc.text('Concrete Bid Quote', 20, 32);
      doc.text('Generated with ScopeCrete | scopecrete.ai', 20, 38);

      doc.setFontSize(14);
      doc.setFont('helvetica', 'bold');
      doc.text('Bid: ' + bid, 20, 52);
      doc.setFontSize(10);
      doc.setFont('helvetica', 'normal');
      doc.text(`Total: ${totalSqFt.toFixed(0)} sq ft  |  PSI: ${psi}  |  Markup: ${markup}%`, 20, 59);
      doc.text('Date: ' + new Date().toLocaleDateString(), 20, 66);

      let y = 78;
      doc.setFontSize(12);
      doc.setFont('helvetica', 'bold');
      doc.text('Scope of Work', 20, y);
      y += 8;
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(10);

      sections.forEach((sec, i) => {
        const L = sec.lengthFt + sec.lengthIn / 12;
        const W = sec.widthFt + sec.widthIn / 12;
        const cy = (L * W * sec.depthIn / 12) / 27;
        doc.text(`${i + 1}. ${L.toFixed(1)}\' x ${W.toFixed(1)}\' x ${sec.depthIn}" = ${cy.toFixed(2)} CY concrete @ ${psi} PSI`, 20, y);
        y += 7;
      });

      y += 4;
      doc.setFont('helvetica', 'bold');
      doc.text('Terms', 20, y);
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(9);
      doc.text('Quote valid for 30 days. Final pricing subject to on-site verification.', 20, y + 7);
      doc.text('A 50% deposit is required to schedule. Balance due upon completion.', 20, y + 13);

      doc.save('scopecrete-quote-' + Date.now() + '.pdf');
      showToast('PDF exported!');
    }

    // ===== INIT =====
    renderSections();
    calculate();
    renderSavedJobs();
  </script>
</body>
</html>
