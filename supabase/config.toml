# Supabase CLI config — ScopeCrete.ai
#
# WHY THIS FILE EXISTS
#
# `supabase functions deploy` sets verify_jwt = true unless told otherwise.
# Before this file existed there was no per-function config in the repo, so any
# deploy would have silently turned Supabase's own JWT gate ON for these
# functions.
#
# That is not hypothetical. quo-intake's trailer comments record it happening
# on 2026-06-22:
#     v44 verify_jwt check
#     v45 - redeploy to lock verify_jwt off
# OpenPhone does not send a Supabase JWT, so with verify_jwt on, every webhook
# is rejected at the gateway before the function body ever runs and intake
# goes dark.
#
# The values below mirror the settings the deployed functions actually had as
# of 2026-08-20, so deploying from this repo preserves them instead of
# resetting them.
#
# quo-intake authenticates callers itself, via OpenPhone's HMAC signature
# (see verifyQuoSignature). That is the intended auth for it — NOT verify_jwt.

project_id = "cxiusuewtrvcpqequueh"

# Webhook receiver. Called by OpenPhone, which cannot present a Supabase JWT.
# Authenticated by HMAC signature inside the function.
#
# quo-intake also ships an empty functions/quo-intake/deno.json. That is not
# decorative. Up to v51 the deployment carried
#     import_map_path = "file:///root/.openclaw/workspace"
# left behind by whatever machine deployed it, and the platform resolves that
# path INSIDE each new source bundle. Every redeploy failed with
#     import map path does not exist - .../source/file:///root/.openclaw/workspace
# Shipping a real deno.json gives the deploy a valid relative import map to
# point at, which overwrote the stale absolute path on v52. Deleting the file
# does not restore the old value, but it does leave the next deploy free to
# inherit a bad one again, so keep it.
[functions.quo-intake]
verify_jwt = false

# Called with a `?secret=` query param rather than a JWT.
[functions.send-estimate-sms]
verify_jwt = false

# Authenticates via x-hermes-org / x-hermes-key headers, not a JWT.
[functions.dusty-mcp]
verify_jwt = false

# Invoked manually/administratively; JWT gate is appropriate here.
[functions.enrich-sms-threads]
verify_jwt = true

# One-time call-media backfill over the full voip_calls history. Admin-invoked,
# never called by a provider, and it hits a rate-limited external API — the JWT
# gate stays ON.
[functions.backfill-call-media]
verify_jwt = true

# The background enricher (migration 029/030). Called every five minutes by
# pg_cron with a bearer token from the vault (enrich_worker_token), which the
# function checks itself via sc_enrich_worker_authorized(). That token is not a
# JWT, so the gateway check is OFF. It was ON before, and that was worse than
# it looked: the public anon key IS a valid JWT, so anyone holding the browser
# bundle could invoke v2 and get contacts' phone numbers back.
[functions.enrich-contacts]
verify_jwt = false

# THROWAWAY. Read-only probe of the Quo/OpenPhone API, added for work order 4
# to find out why backfill-call-media has never fetched a transcript. Writes
# nothing — no database, no storage. Admin-invoked, so the JWT gate stays ON.
# Delete this function and this block once the API question is settled.
[functions.quo-diagnose]
verify_jwt = true

# Dusty's file reader (migration 046). Same shape as enrich-contacts: pg_cron
# every minute with the vault bearer token, checked in the function via
# sc_enrich_worker_authorized(). Not a JWT, so the gateway check is OFF.
[functions.read-files]
verify_jwt = false
